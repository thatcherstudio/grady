[project]
name = "grady"
version = "0.1.0"
description = "Run a prompt suite against any OpenAI-compatible endpoint, score the answers, and report quality next to speed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "thatcherstudio" }]
keywords = ["evaluation", "llm", "openai-compatible", "ollama", "vllm", "mlx"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[dependency-groups]
dev = [
  "pytest>=9.2",
  "ruff>=0.17",
  "mypy>=2.4",
  "pre-commit>=4.7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grady"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["grady"]
mypy_path = "src"
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
