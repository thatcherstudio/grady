# OpenAI-compatible endpoints. Start a server, then pick an entry with --model <label>.
# Without --model, `grady run` uses every entry, so trim this file to what you run.
models:
  # Ollama: `ollama serve`, then `ollama pull gemma3:4b`.
  - label: ollama-gemma3-4b
    base_url: http://localhost:11434/v1
    model: gemma3:4b

  # vLLM: `vllm serve <hf-model-id>`; set `model` to that id.
  - label: vllm-local
    base_url: http://localhost:8000/v1
    model: Qwen/Qwen2.5-7B-Instruct

  # MLX (Apple Silicon): `mlx_lm.server --model <hf-model-id>`.
  - label: mlx-local
    base_url: http://localhost:8080/v1
    model: mlx-community/Llama-3.2-3B-Instruct-4bit

  # LM Studio: start the local server; its server tab shows the model identifier.
  - label: lmstudio-local
    base_url: http://localhost:1234/v1
    model: your-loaded-model-id

  # Hosted: any OpenAI-compatible provider. The key is read from the named env var and
  # never written to results. Prices (USD per million tokens) are optional; take them from
  # the provider's pricing page if you want `grady compare` to show cost.
  - label: hosted-example
    base_url: https://api.openai.com/v1
    model: your-model-id
    api_key_env: OPENAI_API_KEY
    input_price_per_mtok: null
    output_price_per_mtok: null
