# Short checks that string scorers can grade. Run it with:
#   grady run examples/basic.yaml --models examples/models.local.yaml --model ollama-gemma3-4b
suite: basic
description: Short factual and formatting checks graded by exact, contains and regex.
defaults:
  temperature: 0
  max_tokens: 64
  system: "Answer with only what is asked. No explanation."
cases:
  - id: echo-ok
    prompt: "Reply with exactly the word OK."
    score:
      - exact: "OK"

  - id: add-numbers
    prompt: "What is 17 + 25? Reply with the number only."
    score:
      - exact: "42"

  - id: uppercase
    prompt: "Convert to uppercase: hello world"
    score:
      - exact: "HELLO WORLD"

  - id: largest-planet
    prompt: "Which planet in our solar system is the largest?"
    score:
      - contains: { value: "jupiter", ignore_case: true }

  - id: primary-colors-of-light
    prompt: "List the three primary colors of light, separated by commas."
    score:
      - contains: { value: ["red", "green", "blue"], ignore_case: true }

  - id: iso-date
    prompt: "Write March 3, 2027 in ISO 8601 format (YYYY-MM-DD)."
    score:
      - regex: '^\s*2027-03-03\s*$'

  - id: json-person
    prompt: 'Return a JSON object with keys "name" and "age" for a 30-year-old named Ana.'
    max_tokens: 128
    score:
      - contains: '"name"'
      - regex: '"age"\s*:\s*30\b'

  # Letter counting trips up small models, so expect some to fail this one. The regex accepts
  # "3" or "three": a first run failed `exact: "3"` on the answer "Three", which was a format
  # miss, not a counting miss.
  - id: count-letters
    prompt: "How many times does the letter r appear in the word strawberry? Reply with the number only."
    score:
      - regex: '(?i)^\s*(3|three)\.?\s*$'
